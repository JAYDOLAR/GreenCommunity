name: Build and deploy Node.js app to Azure Web App - greencommunity

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: greencommunity-app
  NODE_VERSION: '22.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            Server/package-lock.json

      - name: Verify project structure
        run: |
          echo "Verifying project structure..."
          echo "Current directory: $(pwd)"
          ls -la
          
          if [ ! -d "client" ]; then
            echo "❌ ERROR: client directory missing"
            exit 1
          fi
          
          if [ ! -d "Server" ]; then
            echo "❌ ERROR: Server directory missing"
            exit 1
          fi
          
          if [ ! -f "client/package.json" ]; then
            echo "❌ ERROR: client/package.json missing"
            exit 1
          fi
          
          if [ ! -f "Server/package.json" ]; then
            echo "❌ ERROR: Server/package.json missing"
            exit 1
          fi
          
          echo "✅ Project structure verified"
          echo "Client package.json exists: $(test -f client/package.json && echo "✅" || echo "❌")"
          echo "Server package.json exists: $(test -f Server/package.json && echo "✅" || echo "❌")"
          echo "Client package-lock.json exists: $(test -f client/package-lock.json && echo "✅" || echo "❌")"
          echo "Server package-lock.json exists: $(test -f Server/package-lock.json && echo "✅" || echo "❌")"

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            Server/node_modules
            client/.next/cache
          key: deps-${{ runner.os }}-${{ hashFiles('client/package-lock.json', 'Server/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -e  # Exit on any error
          
          echo "Current directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          
          echo "Installing client dependencies..."
          cd client
          echo "Installing in: $(pwd)"
          
          # Try npm ci first, fallback to npm install if it fails
          if npm ci --prefer-offline --no-audit --silent 2>/dev/null; then
            echo "✅ Client dependencies installed with npm ci"
          else
            echo "⚠️ npm ci failed, trying npm install..."
            rm -rf node_modules package-lock.json
            npm install --prefer-offline --no-audit --silent
            echo "✅ Client dependencies installed with npm install"
          fi
          
          echo "Installing server dependencies..."
          cd ../Server
          echo "Installing in: $(pwd)"
          
          # Try npm ci first, fallback to npm install if it fails
          if npm ci --legacy-peer-deps --prefer-offline --no-audit --silent 2>/dev/null; then
            echo "✅ Server dependencies installed with npm ci"
          else
            echo "⚠️ npm ci failed, trying npm install..."
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps --prefer-offline --no-audit --silent
            echo "✅ Server dependencies installed with npm install"
          fi
          
          echo "✅ All dependencies installed successfully"

      - name: Build Next.js client
        working-directory: ./client
        run: |
          echo "Building Next.js client..."
          echo "Available memory: $(free -h)"
          echo "Disk space: $(df -h)"
          
          # Set environment variables for build
          export NODE_OPTIONS="--max-old-space-size=4096"
          export NEXT_TELEMETRY_DISABLED=1
          
          npm run build || {
            echo "❌ Build failed!"
            echo "Checking for common issues..."
            echo "Node modules size: $(du -sh node_modules 2>/dev/null || echo 'Not found')"
            echo "Package.json scripts:"
            cat package.json | grep -A 10 '"scripts"'
            exit 1
          }
          
          echo "✅ Build completed successfully"

      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          mkdir -p deployment-package/client

          # Copy server files efficiently (exclude deployment-package.json)
          rsync -a --exclude='node_modules' --exclude='.git*' --exclude='tests/' \
            --exclude='__tests__/' --exclude='*.test.*' --exclude='*.spec.*' \
            --exclude='coverage/' --exclude='*.log' --exclude='*.md' \
            --exclude='deployment-package.json' \
            Server/ deployment-package/

          # Copy Next.js build and essentials (src/ NOT needed at runtime)
          cp -r client/.next client/public deployment-package/client/
          cp client/package*.json client/next.config.mjs deployment-package/client/
          [ -f "client/middleware.js" ] && cp client/middleware.js deployment-package/client/
          [ -f "client/jsconfig.json" ] && cp client/jsconfig.json deployment-package/client/
          [ -f "client/components.json" ] && cp client/components.json deployment-package/client/

          # Copy Azure config
          [ -f "Server/web.config" ] && cp Server/web.config deployment-package/

          # Create startup script
          cat > deployment-package/startup.sh << 'EOF'
          #!/bin/bash
          echo "Starting GreenCommunity application..."
          NODE_ENV=production node server.js
          EOF
          chmod +x deployment-package/startup.sh

      - name: Install production dependencies and optimize
        working-directory: deployment-package
        run: |
          # Install server production deps
          npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit --silent
          
          # Install client production deps
          cd client && npm ci --omit=dev --prefer-offline --no-audit --silent && cd ..
          
          # Aggressive cleanup for smaller package
          find . -name "*.map" -type f -delete 2>/dev/null || true
          find . -name "*.md" -type f -delete 2>/dev/null || true
          find . -name "*.test.*" -delete 2>/dev/null || true
          find . -type d -name "test" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "tests" -path "*/node_modules/*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf client/.next/cache node_modules/.cache client/node_modules/.cache 2>/dev/null || true
          
          echo "Package size: $(du -sh . | cut -f1)"

      - name: Create ZIP package
        run: |
          cd deployment-package
          zip -r -q ../deployment.zip . -x "*.git*"
          echo "ZIP size: $(du -h ../deployment.zip | cut -f1)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure and Deploy to Azure
        run: |
          # Configure app settings
          # NOTE: Do NOT set WEBSITE_RUN_FROM_PACKAGE=1 — it makes the filesystem
          #       read-only and conflicts with the custom startup file.
          az webapp config appsettings set \
            --resource-group Green_Community \
            --name greencommunity-app \
            --settings \
            SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            WEBSITE_NODE_DEFAULT_VERSION=22.x \
            NODE_ENV=production \
            WEBSITE_ENABLE_SYNC_UPDATE_SITE=true \
            WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
            --output none &
          CONFIG_PID=$!

          az webapp config set \
            --resource-group Green_Community \
            --name greencommunity-app \
            --startup-file "node server.js" \
            --output none &
          STARTUP_PID=$!

          wait $CONFIG_PID $STARTUP_PID

          # Remove WEBSITE_RUN_FROM_PACKAGE if it was set in a previous deploy
          az webapp config appsettings delete \
            --resource-group Green_Community \
            --name greencommunity-app \
            --setting-names WEBSITE_RUN_FROM_PACKAGE \
            --output none 2>/dev/null || true

          # Deploy (synchronous so we get real success/failure feedback)
          echo "Deploying to Azure..."
          az webapp deploy \
            --resource-group Green_Community \
            --name greencommunity-app \
            --src-path deployment.zip \
            --type zip \
            --timeout 600

          echo "Deployment completed successfully"

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to settle..."
          sleep 30

          # Health check: 6 attempts, 20s apart (up to ~2 min)
          for i in 1 2 3 4 5 6; do
            echo "Health check attempt $i/6..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 \
              "https://greencommunity-app.azurewebsites.net/api/health" 2>/dev/null || echo "000")
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Application is healthy!"
              curl -s -m 10 "https://greencommunity-app.azurewebsites.net/api/health" || true
              exit 0
            fi
            [ $i -lt 6 ] && sleep 20
          done

          # Check Azure-side state
          STATUS=$(az webapp show --resource-group Green_Community --name greencommunity-app --query "state" -o tsv 2>/dev/null || echo "Unknown")
          echo "App state: $STATUS"
          echo "Fetching recent logs..."
          az webapp log tail --resource-group Green_Community --name greencommunity-app --lines 30 2>/dev/null || true

          if [ "$STATUS" = "Running" ]; then
            echo "App is running but health endpoint not yet responding. May need warm-up."
          else
            echo "WARNING: App state is $STATUS"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "Deployment Summary"
          echo "======================================"
          echo "App URL: https://greencommunity-app.azurewebsites.net"
          echo ""
          echo "Monitoring:"
          echo "  - Logs: https://greencommunity-app.scm.azurewebsites.net/api/logs/docker"
          echo "  - Stream: https://greencommunity-app.scm.azurewebsites.net/api/logstream"
          echo "======================================"

      - name: Cleanup
        if: always()
        run: rm -rf deployment-package deployment.zip
